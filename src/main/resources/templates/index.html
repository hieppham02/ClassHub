<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ thống Mượn trả EAUT</title>
    <!-- Tích hợp Thymeleaf bằng th:href -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Google Fonts for modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Header -->
<header class="header">
    <div class="header-container">
        <div class="logo">
            <i data-lucide="school"></i>
            <h1>Hệ thống Mượn trả EAUT</h1>
        </div>
        <div class="user-info">
            <nav class="header-nav">
                <!-- Chuyển hướng về Trang chủ -->
                <a href="/" style="text-decoration: none;">
                    <button type="button" class="btn-nav active-nav" id="btn-home"><i data-lucide="home"></i> Trang chủ</button>
                </a>
                
                <!-- Chuyển hướng sang trang Lịch sử mượn -->
                <a href="/lich-su" style="text-decoration: none;">
                    <button type="button" class="btn-nav" id="btn-history"><i data-lucide="clock"></i> Lịch sử mượn</button>
                </a>
            </nav>
            <div class="divider"></div>
            <span class="user-greeting" th:if="${session.loggedInUser != null}">
                Xin chào, <strong th:text="${session.loggedInUser.hoTen}"></strong>
            </span>
            
            <form th:if="${session.loggedInUser == null}" th:action="@{/login}" method="GET" style="display: inline;">
                <button type="submit" class="btn-logout">
                    <i data-lucide="log-in"></i> Đăng nhập
                </button>
            </form>
            
            <form th:if="${session.loggedInUser != null}" th:action="@{/logout}" method="GET" style="display: inline;">
                <button type="submit" class="btn-logout">
                    <i data-lucide="log-out"></i> Đăng xuất
                </button>
            </form>
        </div>
    </div>
</header>

    <!-- Main Content -->
    <main class="main-content">
        <!-- Booking View -->
        <div id="booking-view">
            <!-- Filter Section -->
            <section class="filter-section">
                <div class="filter-group">
                    <label for="building-select">Tòa nhà</label>
                    <select id="building-select" class="form-control">
                        <option value="ALL">Tất cả các tòa</option>
                        <option value="Tòa EAUT">Tòa EAUT</option>
                        <option value="Tòa PLC">Tòa POLYCO</option>
                        <option value="Tòa TT">Tòa Thuận Thành</option>
                        <option value="Tòa DTD">Tòa Đinh Trọng Dật</option>
                        <option value="Tòa VNB">Tòa Việt Nam Building</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="date-select">Ngày mượn</label>
                    <input type="date" id="date-select" class="form-control">
                </div>
                <div class="filter-group">
                    <label for="shift-select">Ca học</label>
                    <select id="shift-select" class="form-control">
                        <option value="1">Ca 1 (07:00 - 09:30)</option>
                        <option value="2">Ca 2 (09:30 - 12:00)</option>
                        <option value="3">Ca 3 (13:00 - 15:30)</option>
                        <option value="4">Ca 4 (15:30 - 18:00)</option>
                        <option value="5">Ca 5 (18:00 - 20:30)</option>
                    </select>
                </div>
                <div class="filter-group button-group">
                    <button class="btn-primary" id="btn-search"><i data-lucide="search"></i> Tìm kiếm</button>
                </div>
            </section>

            <!-- Room List Section -->
            <section class="room-list" id="room-list">
                <!-- Cards will be injected here by JS grouped by building -->
            </section>
        </div>

        <!-- History View -->
        <div id="history-view" class="hidden">
            <div class="history-header">
                <h2>Lịch sử mượn phòng & thiết bị</h2>
            </div>
            <div id="history-list">
                <!-- History items injected by JS -->
            </div>
        </div>
    </main>

    <!-- Borrow Modal -->
    <div class="modal-backdrop" id="borrow-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Xác nhận mượn phòng</h2>
                <button class="btn-close" id="btn-close-modal"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <p>Bạn có chắc chắn muốn đăng ký mượn <strong id="modal-room-name"></strong>?</p>
                <div class="modal-details">
                    <p><strong>Ngày:</strong> <span id="modal-date"></span></p>
                    <p><strong>Ca:</strong> <span id="modal-shift"></span></p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="btn-cancel-modal">Hủy</button>
                <button class="btn-primary" id="btn-confirm-modal">Xác nhận</button>
            </div>
        </div>
    </div>

    <!-- Cancel Modal -->
    <div class="modal-backdrop" id="cancel-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Xác nhận hủy mượn</h2>
                <button class="btn-close" id="btn-close-cancel-modal"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <p>Bạn có chắc chắn muốn hủy đăng ký mượn <strong id="cancel-modal-room-name"></strong> không?</p>
                <p style="margin-top: 0.5rem; color: var(--text-muted); font-size: 0.9rem;">Phòng sẽ được trả lại trạng thái trống cho người khác mượn.</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="btn-cancel-cancel-modal">Quay lại</button>
                <button class="btn-danger" id="btn-confirm-cancel-modal">Xác nhận hủy</button>
            </div>
        </div>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div id="toast-icon-container"></div>
        <span id="toast-message"></span>
    </div>

    <!-- Tích hợp Thymeleaf bằng th:src -->
    <script type="module" th:src="@{/js/home.js}"></script>
</body>
</html>
