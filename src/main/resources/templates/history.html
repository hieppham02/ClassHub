<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử mượn</title>
    <!-- Tích hợp Thymeleaf bằng th:href -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Google Fonts for modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <i data-lucide="school"></i>
                <h1>ClasHub</h1>
            </div>
            <div class="user-info">
                <nav class="header-nav">
                    <a href="/index.html" th:href="@{/}" class="btn-nav" style="text-decoration: none;"><i data-lucide="home"></i> Trang chủ</a>
                    <a href="/history.html" th:href="@{/lich-su}" class="btn-nav active-nav" style="text-decoration: none;"><i data-lucide="clock"></i> Lịch sử mượn</a>
                </nav>
                <div class="divider"></div>
                <span class="user-greeting">Xin chào, <strong th:text="${session.loggedInUser.hoTen}">Sinh viên</strong></span>
                <a href="/login.html" th:href="@{/logout}" class="btn-logout" style="text-decoration: none;"><i data-lucide="log-out"></i> Đăng xuất</a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div id="history-view">
            <div class="history-header">
                <h2>Lịch sử mượn phòng & thiết bị</h2>
            </div>
            <!-- Danh sách lịch sử -->            
                <div id="history-list">
                    <div class="empty-state">Đang tải dữ liệu...</div>
                </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div id="toast-icon-container"></div>
        <span id="toast-message"></span>
    </div>

    <script type="module" th:src="@{/js/history.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
