<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch sử mượn</title>
    <!-- Tích hợp Thymeleaf bằng th:href -->
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <!-- Google Fonts for modern look -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <!-- Header -->
    <header class="header">
        <div class="header-container">
            <div class="logo">
                <a th:href="@{/}" style="color: white; text-decoration: none; display: flex; align-items: center; gap: 0.75rem;">                
                    <h1>ClassHub</h1>
                </a>
            </div>
            <div class="user-info">
                <nav class="header-nav">
                    <a href="/index.html" th:href="@{/}" class="btn-nav" style="text-decoration: none;">
                        <i data-lucide="home"></i> <span>Trang chủ</span>
                    </a>
                    <a href="/history.html" th:href="@{/lich-su}" class="btn-nav active-nav" style="text-decoration: none;">
                        <i data-lucide="clock"></i> <span>Lịch sử mượn</span>
                    </a>
                </nav>
                <div class="divider"></div>
                <span class="user-greeting">Xin chào, <strong th:text="${session.loggedInUser.hoTen}">Sinh viên</strong></span>
                <a href="/login.html" th:href="@{/logout}" class="btn-logout" style="text-decoration: none;">
                    <i data-lucide="log-out"></i> <span class="hide-text-mobile">Đăng xuất</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="main-content">
        <div id="history-view">
            <div class="history-header">
                <h2>Lịch sử mượn phòng & thiết bị</h2>
                <!-- <button class="btn-On" style="padding: 10px; background: green; color: white; border: none; border-radius: 4px; cursor: pointer;">BẬT ĐÈN</button>
                <button class="btn-Off" style="padding: 10px; background: red; color: white; border: none; border-radius: 4px; cursor: pointer;">TẮT ĐÈN</button>
                <button class="btn-otp" style="padding: 10px; background: #3182ce; color: white; border: none; border-radius: 4px; cursor: pointer;">SEND OTP</button> -->
            </div>
            <!-- Danh sách lịch sử -->            
                <div id="history-list">
                    <div class="empty-state">Đang tải dữ liệu...</div>
                </div>
        </div>
    </main>

    <!-- Toast Notification -->
    <div id="toast" class="toast">
        <div id="toast-icon-container"></div>
        <span id="toast-message"></span>
    </div>

    <!-- Modal Trả thiết bị -->
    <div class="modal-backdrop" id="return-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Xác nhận trả thiết bị</h2>
                <button class="btn-close" id="btn-close-return-modal"><i data-lucide="x"></i></button>
            </div>
            <div class="modal-body">
                <p>Bạn có chắc chắn muốn xác nhận trả phòng và toàn bộ thiết bị đi kèm không?</p>
            </div>
            <div class="modal-footer">
                <button class="btn-secondary" id="btn-cancel-return-modal">Hủy</button>
                <button class="btn-primary" id="btn-confirm-return-modal">Xác nhận trả</button>
            </div>
        </div>
    </div>

    <script type="module" th:src="@{/js/history.js}"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.lucide) {
                lucide.createIcons();
            }
        });
    </script>
</body>
</html>
