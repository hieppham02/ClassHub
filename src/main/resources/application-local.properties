spring.application.name=ems
# Cấu hình kết nối MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/htql_muontrathietbi?useSSL=false&serverTimezone=UTC&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

# Cấu hình Hibernate (Tự động tạo bảng từ Entity)
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jackson.time-zone=Asia/Ho_Chi_Minh
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Ho_Chi_Minh

# Đổi port nếu cổng 8080 bị trùng
server.port=8080